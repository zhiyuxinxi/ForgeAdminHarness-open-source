<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更换密码 · 交付隔离台</title>
  <link rel="stylesheet" href="/forge-gateway/assets/gateway.css">
</head>
<body class="auth-page">
  <main class="auth-shell single-card">
    <section class="auth-card" aria-labelledby="password-title">
      <div>
        <p class="eyebrow">FIRST SIGN-IN</p>
        <h1 id="password-title">先设置你自己的密码</h1>
        <p class="muted">新密码至少 14 位，不能包含用户名。修改后，旧会话会立即失效。</p>
      </div>
      <form id="password-form" novalidate>
        <label for="current-password">当前临时密码</label>
        <div class="password-field">
          <input id="current-password" type="password" autocomplete="current-password" required maxlength="256">
          <button class="text-button" type="button" data-password-toggle="current-password" aria-pressed="false" disabled>显示</button>
        </div>
        <label for="new-password">新密码</label>
        <div class="password-field">
          <input id="new-password" type="password" autocomplete="new-password" required minlength="14" maxlength="256">
          <button class="text-button" type="button" data-password-toggle="new-password" aria-pressed="false" disabled>显示</button>
        </div>
        <label for="confirm-password">再次输入新密码</label>
        <input id="confirm-password" type="password" autocomplete="new-password" required minlength="14" maxlength="256">
        <p id="form-error" class="form-message error" role="alert" hidden></p>
        <button id="password-submit" class="primary-button full-width" type="submit">保存并进入隔离台</button>
      </form>
    </section>
  </main>
  <script type="module" src="/forge-gateway/assets/change-password.js"></script>
</body>
</html>
